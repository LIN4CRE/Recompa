name: Deploy to GitHub Pages

# Third-party actions are pinned to immutable commit SHAs (see SECURITY.md
# for the resolved table and the refresh procedure).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs exactly these two permissions; everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The fingerprint catalogue (10 files, ~4.1 MB) is committed, so this build
      # needs no network at all. The CI workflow separately verifies the snapshot
      # against upstream with `npm run fetch:dat -- --check`.
      - name: Build site
        run: npm run build
        env:
          # GitHub Pages serves from /<repo>/, so emit relative asset URLs.
          BASE_PATH: './'

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
