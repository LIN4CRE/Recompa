name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs exactly these two permissions; everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The fingerprint catalogue (10 files, ~4.1 MB) is committed, so this build
      # needs no network at all. The CI workflow separately verifies the snapshot
      # against upstream with `npm run fetch:dat -- --check`.
      - name: Build site
        run: npm run build
        env:
          # GitHub Pages serves from /<repo>/, so emit relative asset URLs.
          BASE_PATH: './'

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
