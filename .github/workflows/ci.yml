name: CI

# Third-party actions are pinned to immutable commit SHAs (see SECURITY.md
# for the resolved table and the refresh procedure).

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present || npx tsc -p tsconfig.app.json --noEmit

      - name: Unit tests
        run: npm test

      # The fingerprint catalogue is committed data. Rebuild it from upstream and
      # compare content (ignoring the volatile `generatedAt` field) so a stale
      # snapshot fails here instead of shipping. Needs only a read-only token.
      - name: Fingerprint catalogue is current
        run: npm run check:dat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Verify build artefact serves the expected files
        run: |
          node -e "
          const fs = require('node:fs');
          const need = ['dist/index.html', 'dist/_headers', 'dist/worklets/audio-ring.js'];
          for (const f of need) if (!fs.existsSync(f)) { console.error('missing', f); process.exit(1); }
          const wasm = fs.readdirSync('dist/assets').filter((f) => f.endsWith('.wasm'));
          if (wasm.length !== 1) { console.error('expected exactly one wasm asset, found', wasm.length); process.exit(1); }
          console.log('artefact ok:', wasm[0]);
          "

      - name: Upload build artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: recompa-dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
